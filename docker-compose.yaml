services:
  gear-finder:
    build: .
    container_name: gear-finder
    ports:
      - "5000:5000"
    restart: unless-stopped
    # Uncomment below if you add SQLite price history later:
    # volumes:
    #   - ./data:/app/data

  # CLI mode — run ad-hoc searches from the command line:
  #   docker compose run --rm gear-finder-cli "Sony 24-70 GM II"
  #   docker compose run --rm gear-finder-cli "Leica M11-P" --sites keh mpb --json
  #   docker compose run --rm gear-finder-cli --list-sites
  gear-finder-cli:
    build: .
    entrypoint: ["python", "gear_finder.py"]
    profiles: ["cli"]
    restart: "no"
